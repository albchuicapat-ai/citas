<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salud Centro - Solicitud de Cita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center py-3">
            <h1 class="h4 mb-0">Consultorio Salud Centro</h1>
            <small>Reserva de Cita Médica</small>
          </div>
          <div class="card-body p-4">
            
            <form id="formCita" novalidate>
              
              <!-- Nombre completo -->
              <div class="mb-3">
                <label for="nombre" class="form-label font-weight-bold">Nombre completo:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">
                <div class="invalid-feedback" id="errorNombre"></div>
              </div>

              <!-- Correo electrónico -->
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com">
                <div class="invalid-feedback" id="errorEmail"></div>
              </div>

              <!-- Fecha -->
              <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de atención:</label>
                <input type="date" class="form-control" id="fecha" name="fecha">
                <div class="invalid-feedback" id="errorFecha"></div>
              </div>

              <!-- Especialidad -->
              <div class="mb-3">
                <label for="especialidad" class="form-label">Especialidad:</label>
                <select class="form-select" id="especialidad" name="especialidad">
                  <option value="" selected disabled>-- Seleccione una especialidad --</option>
                  <option value="Consulta General">Consulta General</option>
                  <option value="Odontología">Odontología</option>
                  <option value="Nutrición">Nutrición</option>
                </select>
                <div class="invalid-feedback" id="errorEspecialidad"></div>
              </div>

              <!-- Horario -->
              <div class="mb-3">
                <label for="horario" class="form-label">Horario disponible:</label>
                <select class="form-select" id="horario" name="horario">
                  <option value="" selected disabled>-- Seleccione un horario --</option>
                </select>
                <div class="invalid-feedback" id="errorHorario"></div>
              </div>

              <!-- Alerta cuando no hay horarios -->
              <div id="alertaHorarios" class="alert alert-warning d-none" role="alert"></div>

              <!-- Botón de envío -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Continuar a Confirmación</button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
